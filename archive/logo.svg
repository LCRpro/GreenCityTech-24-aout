<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="GreenCity Tech">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- badge -->
  <rect x="8" y="8" width="112" height="112" rx="32" fill="url(#badge)"/>
  <rect x="8" y="8" width="112" height="112" rx="32" fill="url(#glass)"/>
  <rect x="14" y="14" width="100" height="100" rx="27" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="2"/>
  <!-- city skyline (white) -->
  <g fill="#ffffff">
    <rect x="36" y="66" width="15" height="30" rx="4"/>
    <rect x="54" y="52" width="18" height="44" rx="5"/>
    <rect x="75" y="74" width="13" height="22" rx="4"/>
  </g>
  <!-- windows -->
  <g fill="#7C3AED" opacity=".55">
    <rect x="40" y="72" width="3" height="3" rx="1"/>
    <rect x="44" y="72" width="3" height="3" rx="1"/>
    <rect x="40" y="79" width="3" height="3" rx="1"/>
    <rect x="44" y="79" width="3" height="3" rx="1"/>
    <rect x="59" y="60" width="3" height="3" rx="1"/>
    <rect x="64" y="60" width="3" height="3" rx="1"/>
    <rect x="59" y="67" width="3" height="3" rx="1"/>
    <rect x="64" y="67" width="3" height="3" rx="1"/>
  </g>
  <!-- signal waves from the tall building -->
  <g fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round">
    <path d="M78 50a12 12 0 0 1 12 12" opacity=".95"/>
    <path d="M78 42a20 20 0 0 1 20 20" opacity=".6"/>
  </g>
  <!-- accent dot (magenta) -->
  <circle cx="63" cy="46" r="4.4" fill="#EC4899"/>
  <circle cx="92" cy="92" r="7.5" fill="#EC4899"/>
</svg>
