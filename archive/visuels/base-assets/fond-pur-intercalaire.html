<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fond pur intercalaire</title>
  <link rel="stylesheet" href="./shared.css" />
</head>

<body>
  <section class="slide topo-overlay" style="background:
    radial-gradient(circle at 15% 20%, rgba(31,174,154,0.12), transparent 22%),
    radial-gradient(circle at 84% 20%, rgba(246,194,74,0.12), transparent 18%),
    linear-gradient(145deg, #fbfefd 0%, #f0faf5 52%, #eef6fb 100%);">
    <div style="position:absolute; z-index:99; inset:0; background:
      linear-gradient(to right, rgba(15,30,58,0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(15,30,58,0.05) 1px, transparent 1px);
      background-size:56px 56px; opacity:.42;"></div>
    <div
      style="position:absolute; z-index:99;  left:92px; top:92px; width:190px; height:190px; border-radius:999px; border:2px solid rgba(31,174,154,.15);">
    </div>
    <div
      style="position:absolute; z-index:99;  left:138px; top:138px; width:98px; height:98px; border-radius:999px; background:rgba(255,255,255,.54); backdrop-filter:blur(10px);">
    </div>

    <div
      style="position:absolute; z-index:99;  right:-40px; bottom:-72px; width:560px; height:270px; border-radius:250px 0 0 0; background:linear-gradient(135deg, rgba(31,174,154,0.96), rgba(15,30,58,0.96));">
    </div>
    <div
      style="position:absolute; z-index:99;  right:146px; bottom:78px; width:228px; height:228px; border-radius:999px; border:2px solid rgba(246,194,74,.42);">
    </div>
  </section>
</body>

</html>
