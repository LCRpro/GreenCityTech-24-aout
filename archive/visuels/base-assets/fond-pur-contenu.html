<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fond pur contenu</title>
  <link rel="stylesheet" href="./shared.css" />
</head>

<body>
  <section class="slide grid-overlay" style="background:
    radial-gradient(circle at 14% 12%, rgba(31,174,154,0.12), transparent 18%),
    radial-gradient(circle at 88% 18%, rgba(246,194,74,0.11), transparent 16%),
    linear-gradient(135deg, #f9fcfb 0%, #f3fbf8 48%, #f9fbff 100%);">

    <div
      style="position:absolute; right:92px; top:82px; width:140px; height:140px; border-radius:999px; border:2px solid rgba(31,174,154,.16);">
    </div>
    <div
      style="position:absolute; right:132px; top:122px; width:60px; height:60px; border-radius:999px; background:rgba(255,255,255,.58); backdrop-filter:blur(8px);">
    </div>

    <div
      style="position:absolute; right:54px; bottom:44px; width:480px; height:150px; border-radius:999px 999px 0 999px; background:linear-gradient(90deg, rgba(15,30,58,.98), rgba(31,174,154,.92)); transform:rotate(-14deg); opacity:.95;">
    </div>
    <div
      style="position:absolute; right:148px; bottom:26px; width:320px; height:90px; border-radius:999px 999px 0 999px; background:linear-gradient(90deg, rgba(246,194,74,.96), rgba(31,174,154,.92)); transform:rotate(-12deg);">
    </div>
  </section>
</body>

</html>
