<!DOCTYPE html>

<head>

  <title>Fond pur ouverture</title>

<body>
  <section class="slide grid-overlay topo-overlay">

    <div
      style="position:absolute; left:126px; z-index:99;  top:126px; width:116px; height:116px; border-radius:999px; background:rgba(255,255,255,.48); backdrop-filter:blur(10px);">
    </div>
    <div
      style="position:absolute; right:128px; z-index:99;  top:94px; width:18px; height:18px; border-radius:999px; background:#F6C24A; box-shadow:0 0 0 14px rgba(246,194,74,.10);">
    </div>

    <div class="leaf-wave"
      style="right:-120px; bottom:-126px; z-index:99;  width:560px; height:234px; background:linear-gradient(90deg, #1E5A3A, #1FAE9A);">
    </div>
    <div class="leaf-wave"
      style="right:122px; bottom:-88px; z-index:99;  width:468px; height:164px; background:linear-gradient(90deg, #0F1E3A, #1FAE9A); border-radius:999px 999px 0 999px;">
    </div>
    <div class="leaf-wave"
      style="right:-22px; bottom:-54px; z-index:99;  width:332px; height:126px; background:linear-gradient(90deg, #F6C24A, #1FAE9A); opacity:.96;">
    </div>
