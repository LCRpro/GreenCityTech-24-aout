<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fond pur contenu - accent gauche</title>
  <link rel="stylesheet" href="./shared.css" />
</head>

<body>
  <section class="slide grid-overlay" style="background:
    radial-gradient(circle at 10% 20%, rgba(31,174,154,0.14), transparent 20%),
    radial-gradient(circle at 84% 12%, rgba(246,194,74,0.10), transparent 15%),
    linear-gradient(135deg, #f9fcfb 0%, #f1faf7 46%, #f9fbff 100%);">

    <div
      style="position:absolute; left:78px; top:94px; width:124px; height:124px; border-radius:999px; border:2px solid rgba(246,194,74,.22);">
    </div>
    <div
      style="position:absolute; left:142px; top:142px; width:54px; height:54px; border-radius:999px; background:rgba(255,255,255,.62); backdrop-filter:blur(8px);">
    </div>

    <div
      style="position:absolute; left:-42px; bottom:54px; width:520px; height:162px; border-radius:999px 999px 0 999px; background:linear-gradient(90deg, rgba(31,174,154,.92), rgba(15,30,58,.98)); transform:rotate(-10deg); opacity:.94;">
    </div>
    <div
      style="position:absolute; left:128px; bottom:30px; width:286px; height:82px; border-radius:999px 999px 0 999px; background:linear-gradient(90deg, rgba(246,194,74,.96), rgba(31,174,154,.86)); transform:rotate(-8deg);">
    </div>
  </section>
</body>

</html>
