<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fond pur contenu - haut gauche bas centre</title>
  <link rel="stylesheet" href="./shared.css" />
</head>

<body>
  <section class="slide grid-overlay" style="background:
    radial-gradient(circle at 18% 10%, rgba(246,194,74,0.12), transparent 16%),
    radial-gradient(circle at 82% 18%, rgba(31,174,154,0.10), transparent 18%),
    linear-gradient(135deg, #fbfcfb 0%, #f3fbf8 50%, #f8fbff 100%);">

    <div
      style="position:absolute; left:92px; top:70px; width:150px; height:150px; border-radius:999px; border:2px solid rgba(15,30,58,.10);">
    </div>
    <div
      style="position:absolute; left:148px; top:122px; width:72px; height:72px; border-radius:999px; background:rgba(255,255,255,.60); backdrop-filter:blur(8px);">
    </div>

    <div
      style="position:absolute; left:50%; transform:translateX(-50%) rotate(-9deg); bottom:44px; width:560px; height:132px; border-radius:999px 999px 0 999px; background:linear-gradient(90deg, rgba(15,30,58,.96), rgba(31,174,154,.90)); opacity:.92;">
    </div>
    <div
      style="position:absolute; left:50%; transform:translateX(-32%) rotate(-8deg); bottom:24px; width:300px; height:78px; border-radius:999px 999px 0 999px; background:linear-gradient(90deg, rgba(246,194,74,.94), rgba(31,174,154,.84));">
    </div>
  </section>
</body>

</html>
