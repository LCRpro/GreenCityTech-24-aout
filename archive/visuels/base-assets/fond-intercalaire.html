<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fond intercalaire GreenCity Tech</title>
  <link rel="stylesheet" href="./shared.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>
  <section class="slide topo-overlay" style="background:
    radial-gradient(circle at 15% 20%, rgba(31,174,154,0.12), transparent 22%),
    radial-gradient(circle at 84% 20%, rgba(246,194,74,0.12), transparent 18%),
    linear-gradient(145deg, #fbfefd 0%, #f0faf5 52%, #eef6fb 100%);">
    <div style="position:absolute; inset:0; background:
      linear-gradient(to right, rgba(15,30,58,0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(15,30,58,0.05) 1px, transparent 1px);
      background-size:56px 56px; opacity:.45;"></div>
    <div style="position:absolute; left:90px; top:90px; width:180px; height:180px; border-radius:999px; border:2px solid rgba(31,174,154,.16);"></div>
    <div style="position:absolute; left:130px; top:130px; width:100px; height:100px; border-radius:999px; background:rgba(255,255,255,0.52); backdrop-filter:blur(10px);"></div>
    <div style="position:absolute; right:-40px; bottom:-70px; width:540px; height:260px; border-radius:240px 0 0 0; background:linear-gradient(135deg, rgba(31,174,154,0.96), rgba(15,30,58,0.96));"></div>
    <div style="position:absolute; right:140px; bottom:74px; width:220px; height:220px; border-radius:999px; border:2px solid rgba(246,194,74,.4);"></div>
    <div class="content" style="padding: 90px;">
      <div class="pill">Intercalaire de partie</div>
      <div style="margin-top:130px; max-width:980px;">
        <div style="font-size:20px; font-weight:800; letter-spacing:0.28em; text-transform:uppercase; color:#1FAE9A;">GreenCity Tech</div>
        <h1 class="title" style="margin:18px 0 0; font-size:92px; line-height:0.94;">Titre de partie ou idée directrice</h1>
        <p class="subtitle" style="margin-top:28px; max-width:780px; font-size:30px;">
          Un fond plus calme, avec beaucoup d’espace, pour les transitions, les messages structurants
          et les slides qui doivent respirer.
        </p>
      </div>
      <div style="position:absolute; left:92px; bottom:82px; display:flex; align-items:center; gap:18px;">
        <div style="width:86px; height:2px; background:linear-gradient(90deg, #1FAE9A, #0F1E3A); border-radius:999px;"></div>
        <div style="font-size:18px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:rgba(15,30,58,.72);">Structure · Lisibilité · Contraste</div>
      </div>
    </div>
  </section>
</body>
</html>
