<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fond ouverture GreenCity Tech</title>
  <link rel="stylesheet" href="./shared.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
</head>

<body>
  <section class="slide grid-overlay topo-overlay">
    <div class="leaf-wave"
      style="right:-100px; bottom:-120px; width:520px; height:220px; background:linear-gradient(90deg, #1E5A3A, #1FAE9A);">
    </div>
    <div class="leaf-wave"
      style="right:120px; bottom:-85px; width:440px; height:160px; background:linear-gradient(90deg, #0F1E3A, #1FAE9A); border-radius:999px 999px 0 999px;">
    </div>
    <div class="leaf-wave"
      style="right:-30px; bottom:-55px; width:320px; height:130px; background:linear-gradient(90deg, #F6C24A, #1FAE9A); opacity:.95;">
    </div>
    <div class="content" style="padding: 72px 86px;">
      <div class="pill">GreenCity Tech · Soutenance DevOps</div>
      <div class="card" style="margin-top: 78px; width: 950px; padding: 64px 68px 58px;">
        <div style="display:flex; align-items:center; gap:26px; margin-bottom:36px;">
          <div
            style="position:relative; width:88px; height:88px; border-radius:28px; background:linear-gradient(135deg, #1E5A3A, #1FAE9A, #F6C24A); padding:2px;">
            <div style="width:100%; height:100%; border-radius:26px; background:white; position:relative;">
              <div
                style="position:absolute; left:14px; top:14px; width:48px; height:48px; border-radius:48px 48px 10px 48px; border:10px solid #1FAE9A; border-right-color:transparent; transform:rotate(8deg);">
              </div>
              <div
                style="position:absolute; left:34px; top:22px; width:34px; height:34px; border-radius:0 34px 34px 34px; background:#0F1E3A; transform:rotate(38deg);">
              </div>
              <div
                style="position:absolute; right:12px; bottom:12px; width:16px; height:16px; border-radius:999px; background:#F6C24A;">
              </div>
            </div>
          </div>
          <div>
            <div class="title" style="font-size:64px; line-height:0.92;">GreenCity Tech</div>
            <div
              style="margin-top:14px; font-size:16px; font-weight:800; letter-spacing:0.28em; text-transform:uppercase; color:#1FAE9A;">
              Plateforme civic-tech pour collectivités</div>
          </div>
        </div>
        <div class="brand-line" style="position:relative; width:420px; margin:0 0 30px 4px;"></div>
        <div class="title" style="font-size:72px; line-height:0.96; max-width:760px;">
          Signalez. Agissons. Améliorons nos villes.
        </div>
        <p class="subtitle" style="margin-top:24px; max-width:760px; font-size:26px;">
          Base visuelle claire, moderne et institutionnelle pour une soutenance orientée produit, qualité, exploitation
          et service public.
        </p>
      </div>
      <div style="position:absolute; left:92px; bottom:72px; display:flex; gap:16px;">
        <div class="card" style="padding:18px 24px; border-radius:22px; font-weight:700;">DevOps</div>
        <div class="card" style="padding:18px 24px; border-radius:22px; font-weight:700;">Qualité</div>
        <div class="card" style="padding:18px 24px; border-radius:22px; font-weight:700;">Sécurité</div>
      </div>
    </div>
  </section>
</body>

</html>
