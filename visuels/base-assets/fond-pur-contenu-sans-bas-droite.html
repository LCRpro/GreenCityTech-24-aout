<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fond pur contenu - sans bas droite</title>
  <link rel="stylesheet" href="./shared.css" />
</head>

<body>
  <section class="slide grid-overlay" style="background:
    radial-gradient(circle at 14% 12%, rgba(31,174,154,0.12), transparent 18%),
    radial-gradient(circle at 88% 18%, rgba(246,194,74,0.11), transparent 16%),
    linear-gradient(135deg, #f9fcfb 0%, #f3fbf8 48%, #f9fbff 100%);">

    <div
      style="position:absolute; right:92px; top:82px; width:140px; height:140px; border-radius:999px; border:2px solid rgba(31,174,154,.16);">
    </div>
    <div
      style="position:absolute; right:132px; top:122px; width:60px; height:60px; border-radius:999px; background:rgba(255,255,255,.58); backdrop-filter:blur(8px);">
    </div>

    <div
      style="position:absolute; left:84px; bottom:72px; width:220px; height:220px; border-radius:999px; border:1px solid rgba(15,30,58,.08); background:radial-gradient(circle at 40% 40%, rgba(255,255,255,.56), rgba(230,246,239,.18)); backdrop-filter:blur(8px);">
    </div>
  </section>
</body>

</html>
