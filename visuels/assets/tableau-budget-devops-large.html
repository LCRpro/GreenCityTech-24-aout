<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tableau budget DevOps large</title>
  <link rel="stylesheet" href="../base-assets/shared.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <style>
    body {
      background: transparent;
    }

    .canvas {
      width: 760px;
      height: 330px;
      position: relative;
      overflow: hidden;
      background: transparent;
      color: var(--navy);
    }

    .panel {
      position: absolute;
      inset: 10px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(15, 30, 58, 0.08);
      box-shadow: 0 18px 44px rgba(15, 30, 58, 0.08);
      backdrop-filter: blur(10px);
      padding: 18px 20px 16px;
    }

    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .kicker {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(15, 30, 58, 0.55);
    }

    .title {
      margin-top: 4px;
      font-size: 26px;
      line-height: 1.02;
    }

    .chip {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 124px;
      padding: 10px 14px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(31, 174, 154, 0.94), rgba(19, 144, 130, 0.94));
      color: white;
      text-align: center;
      box-shadow: 0 12px 30px rgba(31, 174, 154, 0.22);
    }

    .chip-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      opacity: .84;
    }

    .chip-value {
      margin-top: 4px;
      font-family: Montserrat, sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -.04em;
      line-height: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 18px;
      background: rgba(248, 252, 250, 0.82);
      border: 1px solid rgba(15, 30, 58, 0.08);
    }

    thead th {
      padding: 12px 14px;
      background: rgba(15, 30, 58, 0.94);
      color: white;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      text-align: left;
    }

    thead th.num,
    tbody td.num {
      text-align: right;
    }

    tbody td {
      padding: 11px 14px;
      font-size: 13px;
      border-top: 1px solid rgba(15, 30, 58, 0.08);
    }

    tbody tr:nth-child(even) td {
      background: rgba(230, 246, 239, 0.52);
    }

    tbody tr.total td {
      background: rgba(246, 194, 74, 0.22);
      font-weight: 800;
    }

    .note {
      margin-top: 10px;
      font-size: 11px;
      line-height: 1.35;
      color: rgba(15, 30, 58, 0.62);
    }
  </style>
</head>

<body>
  <section class="canvas">
    <article class="panel">
      <div class="top">
        <div>
          <div class="kicker">Estimation ciblée</div>
          <div class="title title">Coût du renfort DevOps</div>
        </div>
        <div class="chip">
          <div>
            <div class="chip-label">Budget cible</div>
            <div class="chip-value">8,45 k€</div>
          </div>
        </div>
      </div>

      <table aria-label="Estimation du coût DevOps">
        <thead>
          <tr>
            <th>Poste</th>
            <th class="num">Charge</th>
            <th class="num">Coût estimé</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Cadrage</td>
            <td class="num">2 j</td>
            <td class="num">1,3 k€</td>
          </tr>
          <tr>
            <td>Pipeline CI/CD</td>
            <td class="num">4 j</td>
            <td class="num">2,6 k€</td>
          </tr>
          <tr>
            <td>Hébergement VPS</td>
            <td class="num">3 j</td>
            <td class="num">1,95 k€</td>
          </tr>
          <tr>
            <td>Monitoring</td>
            <td class="num">2 j</td>
            <td class="num">1,3 k€</td>
          </tr>
          <tr>
            <td>Déploiement</td>
            <td class="num">2 j</td>
            <td class="num">1,3 k€</td>
          </tr>
          <tr class="total">
            <td>Total estimé</td>
            <td class="num">13 j</td>
            <td class="num">8,45 k€</td>
          </tr>
        </tbody>
      </table>

      <div class="note">Hypothèse : TJM DevOps senior à 650 €.</div>
    </article>
  </section>
</body>

</html>
