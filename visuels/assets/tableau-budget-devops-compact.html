<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tableau budget DevOps compact</title>
  <link rel="stylesheet" href="../base-assets/shared.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <style>
    body {
      background: transparent;
    }

    .canvas {
      width: 520px;
      height: 470px;
      position: relative;
      overflow: hidden;
      background: transparent;
      color: var(--navy);
    }

    .panel {
      position: absolute;
      inset: 10px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.60);
      backdrop-filter: blur(10px);
      padding: 18px 18px 16px;
    }

    .kicker {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(15, 30, 58, 0.55);
    }

    .title {
      margin-top: 5px;
      font-size: 23px;
      line-height: 1.04;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 20px;
      margin-bottom: 14px;
    }

    .metric {
      border-radius: 18px;
      padding: 12px 10px;
      text-align: center;
      background: rgba(230, 246, 239, 0.88);
      border: 1px solid rgba(31, 174, 154, 0.16);
    }

    .metric.sun {
      background: rgba(246, 194, 74, 0.18);
      border-color: rgba(246, 194, 74, 0.24);
    }

    .metric.navy {
      background: rgba(15, 30, 58, 0.94);
      border-color: rgba(15, 30, 58, 0.94);
      color: white;
    }

    .metric-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      opacity: .78;
    }

    .metric-value {
      margin-top: 6px;
      font-family: Montserrat, sans-serif;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -.04em;
      line-height: 1.02;
    }

    table {
      margin-top: 20px;
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 18px;
      background: rgba(248, 252, 250, 0.84);
      border: 1px solid rgba(15, 30, 58, 0.08);
    }

    thead th {
      padding: 10px 12px;
      background: rgba(15, 30, 58, 0.94);
      color: white;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      text-align: left;
    }

    thead th.num,
    tbody td.num {
      text-align: right;
    }

    tbody td {
      padding: 10px 12px;
      font-size: 12px;
      border-top: 1px solid rgba(15, 30, 58, 0.08);
      vertical-align: top;
    }

    tbody tr:nth-child(even) td {
      background: rgba(230, 246, 239, 0.52);
    }

    tbody tr.total td {
      background: rgba(246, 194, 74, 0.22);
      font-weight: 800;
    }

    .note {
      margin-top: 10px;
      font-size: 11px;
      line-height: 1.35;
      color: rgba(15, 30, 58, 0.62);
    }
  </style>
</head>

<body>
  <section class="canvas">
    <article class="panel">
      <div class="kicker">Budget DevOps</div>
      <div class="title title">Estimation partielle</div>

      <div class="summary">
        <div class="metric">
          <div class="metric-label">Charge</div>
          <div class="metric-value">13 j</div>
        </div>
        <div class="metric sun">
          <div class="metric-label">TJM</div>
          <div class="metric-value">650 €</div>
        </div>
        <div class="metric navy">
          <div class="metric-label">Budget</div>
          <div class="metric-value">8,45 k€</div>
        </div>
      </div>

      <table aria-label="Synthèse du coût DevOps">
        <thead>
          <tr>
            <th>Lot</th>
            <th class="num">Jours</th>
            <th class="num">Coût</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Cadrage</td>
            <td class="num">2</td>
            <td class="num">1,3 k€</td>
          </tr>
          <tr>
            <td>Pipeline CI/CD</td>
            <td class="num">4</td>
            <td class="num">2,6 k€</td>
          </tr>
          <tr>
            <td>Hébergement VPS</td>
            <td class="num">3</td>
            <td class="num">1,95 k€</td>
          </tr>
          <tr>
            <td>Monitoring</td>
            <td class="num">2</td>
            <td class="num">1,3 k€</td>
          </tr>
          <tr>
            <td>Déploiement</td>
            <td class="num">2</td>
            <td class="num">1,3 k€</td>
          </tr>
          <tr class="total">
            <td>Total</td>
            <td class="num">13</td>
            <td class="num">8,45 k€</td>
          </tr>
        </tbody>
      </table>

    </article>
  </section>
</body>

</html>
