<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Préparation</title>
<link rel="stylesheet" href="./shared.css">
<style>
  .prep { min-height:520px; display:grid; place-items:center; }
  .prep-card { width:760px; text-align:center; padding:42px 52px; border-radius:28px; background:linear-gradient(145deg,var(--indigo),#33206c); color:#fff; box-shadow:0 22px 44px rgba(30,27,75,.24); }
  .prep-card .kicker { color:#d8c5ff; }
  .prep-card h1 { font-family:"Baloo 2",sans-serif; font-size:52px; margin:8px 0 12px; }
  .prep-card p { font-size:21px; margin:0 auto; max-width:590px; line-height:1.4; color:rgba(255,255,255,.9); }
  .code-label { margin-top:30px; font-size:14px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:#d8c5ff; }
  #remoteCode { display:inline-block; margin-top:9px; padding:12px 30px; border-radius:14px; background:#fff; color:var(--violet-deep); font-family:"Baloo 2",sans-serif; font-size:48px; font-weight:800; letter-spacing:.14em; }
  .remote-url { margin-top:22px!important; font-size:17px!important; color:#d8c5ff!important; }
  .remote-url code { color:#fff; font-weight:700; }
</style>
</head>
<body>
<section class="slide">
  <div class="stage">
    <div class="head">
      <span class="num">0</span>
      <h2>Préparation</h2>
      <img class="logo sm head-logo" src="./logo-greencity-mark.png" alt="GreenCity Tech">
    </div>
    <div class="prep">
      <div class="prep-card">
        <div class="kicker">Avant de commencer</div>
        <h1>Préparation de l'oral</h1>
        <p>Ouvre la télécommande sur ton téléphone, saisis ce code, puis tu peux lancer le diaporama.</p>
        <div class="code-label">Code télécommande</div>
        <span id="remoteCode">----</span>
        <p class="remote-url">Téléphone : <code>/slides/remote.html</code></p>
      </div>
    </div>
  </div>
  <div class="pageno"><b>Prépa</b></div>
</section>
</body>
</html>
